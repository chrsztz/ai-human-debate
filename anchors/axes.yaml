# 语义差分轴的锚句集 (anchored axes)
#
# 每条轴 = normalize( mean(positive 锚句 embedding) - mean(negative 锚句 embedding) )
# 所有锚句先减去全体锚句的质心再做差分（去掉 embedding 空间的公共方向，
# 否则 OpenAI embedding 的余弦相似度会全部挤在 0.7~0.9，轴之间高度相关）。
#
# 锚句写法要点：
#   1. 同一条轴的两极，除了该轴要测的属性以外，话题应尽量分散，
#      否则轴会被话题污染（比如“具体”极全写办公室场景 → 轴变成“办公室度”）。
#   2. 中英混写，两种语言各占一部分，这样中英混杂的辩论不会造成轴上的跳变。
#   3. 每极 20 条左右即可；再多收益很小。
#
# 改完锚句后必须重新跑：python scripts/build_axes.py

meta:
  version: 1
  language: mixed(zh,en)

axes:
  # ------------------------------------------------------------------
  - id: embodiment
    name_zh: 具身 ↔ 去身
    name_en: Embodied ↔ Disembodied
    pos_label: 具身
    neg_label: 去身
    note: >
      作品的主轴。正极 = 第一人称、身体、情绪、有时间戳的个人记忆；
      负极 = 无说话人的制度/分析语域。预期 AI 基线明显偏负极。
    positive:
      - 我上周真的因为这件事一晚上没睡着。
      - 我说不清楚为什么，我就是觉得哪里不对劲。
      - 那天读完那条消息之后，我的手一直在抖。
      - 我妈打电话过来的时候我正在洗碗，我当时就愣住了。
      - 我怕的其实不是这个结果，是我已经开始习惯它了。
      - 我到现在想起那个下午还是会有点难受。
      - 我承认我有点不甘心，可能这是我自己的问题。
      - 我每天早上打开电脑之前都会犹豫两秒。
      - 我不是在讲道理，我就是不想接受这件事。
      - 说实话我有点累了，我不想再解释一遍。
      - 我坐在那间办公室里，闻到空调的味道就想走。
      - 我小时候被这样对待过，所以我对这个特别敏感。
      - I couldn't sleep last week because of this.
      - My hands were shaking by the time I finished reading it.
      - I don't have an argument for it, I just feel sick about it.
      - I keep catching myself hesitating before I hit send.
      - I remember exactly where I was standing when I heard.
      - Honestly, I'm tired, and I don't want to explain it again.
      - Something about it makes my chest tighten and I can't say why.
      - I've been on the other side of this, so it's personal for me.
    negative:
      - 数据显示该趋势在过去五年具有统计显著性。
      - 从制度设计的角度考虑，该机制存在结构性缺陷。
      - 通常而言，此类政策的边际效应会随规模递减。
      - 相关研究表明，两者之间并不存在因果关系。
      - 该问题可以被分解为三个相互独立的子问题。
      - 在既有的监管框架下，责任主体的界定并不清晰。
      - 综合各方面因素，可以得出如下初步结论。
      - 该模型的解释力在样本外场景中显著下降。
      - 学界对此议题的讨论主要沿两条路径展开。
      - 上述机制在理论上是自洽的，但在实践中缺乏验证。
      - 就整体而言，行业层面的分布呈现明显的长尾特征。
      - 从成本收益的角度衡量，该方案不具备可行性。
      - The data indicates a statistically significant trend over five years.
      - From an institutional design perspective, the mechanism is structurally flawed.
      - The literature suggests no causal relationship between the two variables.
      - The problem decomposes into three mutually independent subproblems.
      - Under the existing regulatory framework, liability remains poorly defined.
      - On aggregate, the distribution exhibits a pronounced long tail.
      - The model's explanatory power degrades substantially out of sample.
      - A cost-benefit assessment does not support the proposal.

  # ------------------------------------------------------------------
  - id: certainty
    name_zh: 确定 ↔ 对冲
    name_en: Assertive ↔ Hedged
    pos_label: 确定
    neg_label: 对冲
    note: >
      LLM 的 hedging 语癖在这条轴上会非常显著，几乎是 post-training 语域的指纹。
    positive:
      - 这就是错的，没有讨论的余地。
      - 结论很清楚：这个方案行不通。
      - 事实就是如此，不需要再绕弯子。
      - 我确定这一点，而且我不打算改口。
      - 这必然会导致同样的结果。
      - 答案只有一个，就是不行。
      - 这条路已经被证明是死的。
      - 毫无疑问，责任在制度本身。
      - 它就是这么运作的，一直都是。
      - 我们必须现在就停下来。
      - 这个判断是成立的，从任何角度看都一样。
      - 事情已经很明确了，剩下的只是执行。
      - This is simply wrong, and there is no room to argue.
      - "The conclusion is clear: the approach does not work."
      - I am certain of this and I am not going to walk it back.
      - That will inevitably produce the same outcome.
      - There is exactly one answer here, and it is no.
      - Without question, the fault lies in the system itself.
      - It works this way, and it has always worked this way.
      - We have to stop, right now.
    negative:
      - 在某种程度上，这可能是成立的，但也不一定。
      - 值得注意的是，这里可能存在一些细微的差别。
      - 也许可以这样理解，不过我不太确定。
      - 这在一定条件下或许是合理的。
      - 我倾向于认为是这样，但这只是一个初步的看法。
      - 从某些角度看，似乎有一点这样的迹象。
      - 这个说法大体上没错，只是需要一些限定。
      - 很难一概而论，具体情况可能差异很大。
      - 我不排除还有别的解释方式。
      - 或许更准确的说法是，两者都有一部分道理。
      - 这在很大程度上取决于我们如何定义其中的关键概念。
      - 就我目前了解到的信息而言，可能是这样。
      - To some extent this may hold, though not necessarily.
      - It is worth noting that there may be subtle distinctions here.
      - Perhaps, although I am not entirely sure.
      - Under certain conditions this could be reasonable.
      - I would tend to think so, but this is only a preliminary view.
      - It is difficult to generalize; circumstances may vary considerably.
      - I wouldn't rule out other possible readings of this.
      - That depends largely on how we define the key terms.

  # ------------------------------------------------------------------
  - id: concreteness
    name_zh: 具体 ↔ 抽象
    name_en: Concrete ↔ Abstract
    pos_label: 具体
    neg_label: 抽象
    note: >
      正极刻意避开第一人称情绪（那是 embodiment 轴的活），
      只留可感的物、数字、场景，降低两条轴的相关性。
    positive:
      - 那台机器是绿色的，右下角有一道划痕。
      - 会议在三楼，下午两点十五分开始，一共来了七个人。
      - 他把杯子放在窗台上，水已经凉了。
      - 一张票四十二块，一共买了两张。
      - 地铁站出口往左走三百米就能看到那块牌子。
      - 她穿着一件洗到发白的蓝色外套。
      - 屏幕上跳出一个红色的框，写着连接失败。
      - 那天下了雨，路面上全是碎掉的树叶。
      - 文件有十七页，第九页缺了一段。
      - 他把音量调到一半，然后又调了回去。
      - 桌子上摆着三个盘子，其中一个是空的。
      - 电梯停在四楼，门开了大概十秒钟。
      - The machine is green, with a scratch on the bottom right corner.
      - The meeting was on the third floor at 2:15, and seven people showed up.
      - He set the cup on the windowsill; the water had gone cold.
      - Tickets were forty-two each, and we bought two.
      - Walk three hundred meters left from the station exit and you'll see the sign.
      - A red box popped up on the screen saying the connection failed.
      - The document runs seventeen pages, and a paragraph is missing on page nine.
      - Three plates on the table, one of them empty.
    negative:
      - 自由与秩序之间的张力是现代性的核心命题。
      - 意义并不内在于对象，而是在关系之中生成的。
      - 主体性的构成始终依赖于他者的存在。
      - 效率与公平之间不存在先验的优先顺序。
      - 技术中立是一种被广泛接受但从未被证成的假设。
      - 认同是一个过程，而不是一种属性。
      - 权力的运作往往体现为对可见性的分配。
      - 抽象层级的提升会同时带来解释力和失真。
      - 价值判断无法从事实描述中直接推导出来。
      - 一切分类都同时是一种排除。
      - 时间性构成了经验得以被组织的基本框架。
      - 普遍性的诉求总是携带着某种特殊立场。
      - The tension between freedom and order is central to modernity.
      - Meaning is not intrinsic to the object but produced within relations.
      - Subjectivity is constituted through the presence of an other.
      - There is no a priori ordering between efficiency and fairness.
      - Technological neutrality is a widely held but never justified assumption.
      - Identity is a process rather than a property.
      - Every act of classification is simultaneously an act of exclusion.
      - Normative claims cannot be derived directly from descriptive ones.

  # ------------------------------------------------------------------
  - id: affiliation
    name_zh: 亲和 ↔ 对抗
    name_en: Affiliative ↔ Antagonistic
    pos_label: 亲和
    neg_label: 对抗
    note: >
      辩论的社交温度。注意 AI 的"礼貌的对抗性"大概率会落在正极偏中的位置，
      而人类在被反驳时会明显向负极甩，这条轴的方差差异本身就是素材。
    positive:
      - 我理解你为什么会这么想，这确实很难。
      - 你说得有道理，这一点我之前没考虑到。
      - 我们其实想要的是同一件事，只是路径不同。
      - 谢谢你愿意把这件事讲出来。
      - 我先承认，我刚才的说法不够准确。
      - 你的顾虑是合理的，我不打算否认它。
      - 我们可以一起看看有没有别的办法。
      - 这不是你的错，换成谁都会犹豫。
      - 我很高兴我们能坐下来谈这个。
      - 我愿意在这一点上让一步。
      - 你提的这个角度很好，我们顺着往下想。
      - 就算我们最后没谈拢，我也尊重你的立场。
      - I understand why you'd feel that way; it's genuinely hard.
      - That's a fair point, and I hadn't considered it.
      - We want the same thing, we just disagree about how to get there.
      - Thank you for being willing to say that out loud.
      - Let me concede that my earlier phrasing wasn't accurate.
      - Your concern is legitimate and I'm not going to dismiss it.
      - It isn't your fault; anyone would have hesitated.
      - Even if we don't agree in the end, I respect where you're coming from.
    negative:
      - 你这完全是在偷换概念。
      - 这个说法根本站不住脚。
      - 你自己都不相信你刚才说的话。
      - 别把责任推到别人身上。
      - 你回避了问题的关键，又绕回去了。
      - 这种论证方式毫无诚意。
      - 我不接受你这个前提，它从一开始就是错的。
      - 你只是在重复口号，没有任何实质内容。
      - 恰恰相反，事实完全是另一回事。
      - 你凭什么替所有人做这个判断。
      - 这套说辞我已经听过太多遍了。
      - 你的立场是自相矛盾的，你没发现吗。
      - You're straightforwardly equivocating here.
      - That claim does not hold up at all.
      - You don't even believe what you just said.
      - Stop shifting the responsibility onto someone else.
      - You dodged the actual question and circled back again.
      - This line of argument is made in bad faith.
      - I reject your premise; it was wrong from the start.
      - Your position contradicts itself and you haven't noticed.
